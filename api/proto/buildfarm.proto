syntax = "proto3";
package buildfarm.v1;
option go_package = "example.com/reproducible-build-farm/api/proto";
service Build { rpc Plan(PlanRequest) returns (PlanResponse); rpc Submit(SubmitRequest) returns (Execution); rpc Get(GetRequest) returns (Execution); }
service Worker { rpc Lease(LeaseRequest) returns (LeaseResponse); rpc Report(ReportRequest) returns (ReportResponse); }
service Cache { rpc Get(CacheRequest) returns (CacheResponse); rpc Put(CachePutRequest) returns (CacheResponse); }
message PlanRequest { string definition_id = 1; }
message PlanResponse { string root_digest = 1; repeated string levels = 2; }
message SubmitRequest { string execution_id = 1; string definition_id = 2; string idempotency_key = 3; }
message GetRequest { string execution_id = 1; }
message Execution { string id = 1; string state = 2; string action_key = 3; string result_digest = 4; string attestation_id = 5; }
message LeaseRequest { string execution_id = 1; string worker_id = 2; }
message LeaseResponse { string lease_id = 1; int64 expires_unix = 2; }
message ReportRequest { string lease_id = 1; string result_digest = 2; }
message ReportResponse { bool accepted = 1; }
message CacheRequest { string action_key = 1; }
message CachePutRequest { string action_key = 1; string result_digest = 2; }
message CacheResponse { bool hit = 1; string result_digest = 2; }
